name: test

on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: Build
        run: go build -v .

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: Run tests
        timeout-minutes: 5
        run: go test -short -v -cover ./...

  integration_test:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - name: Get dependencies
        run: go mod download
      - name: Run integration tests
        timeout-minutes: 5
        env:
          ROOTLY_API_TOKEN: ${{ secrets.ROOTLY_API_TOKEN }}
        run: go test -v -cover ./test/

  # Catch-all required check for the test workflow
  test-success:
    needs:
      - build
      - test
      - integration_test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed, cancelled or skipped jobs
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
