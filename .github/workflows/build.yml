name: build

on:
  - push
  - pull_request

jobs:
  go-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - run: make build

  # Catch-all required check for the build workflow
  build-success:
    needs:
      - go-build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed, cancelled or skipped jobs
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
