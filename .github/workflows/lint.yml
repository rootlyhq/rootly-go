name: lint

on:
  - push
  - pull_request

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - name: Run Golangci Linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
  gomod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - run: |
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum
      - run: |
          cd tools
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum

  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
      - run: |
          make gen
          git diff --exit-code

  # Catch-all required check for the lint workflow
  lint-success:
    needs:
      - golangci
      - gomod
      - generate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed, cancelled or skipped jobs
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
